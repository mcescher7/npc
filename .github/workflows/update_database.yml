name: Update Fantasy Data & Upsert

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 1. Installiert requirements aus dem scripts-Ordner
          pip install -r scripts/requirements.txt
          # 2. Direkte Absicherung: psycopg explizit im selben Python-Pfad installieren
          pip install "psycopg[binary]"

      - name: Verify installed packages
        run: |
          python -c "import psycopg; print('psycopg erfolgreich geladen, Version:', psycopg.__version__)"

      - name: Run update.py
        working-directory: ./scripts
        run: python update.py

      - name: Run import_upsert.py
        working-directory: ./scripts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python import_upsert.py
